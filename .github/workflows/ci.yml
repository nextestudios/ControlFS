name: CI

# Builds the app and runs the tests on every pull request and on main, on Windows:
# the WinUI 3 app only runs there. The portable core is also tested on Linux.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore ControlFS.slnx --locked-mode

      - name: Build
        run: dotnet build ControlFS.slnx -c Release --no-restore --nologo

      - name: Unit tests and journeys
        run: dotnet test tests/ControlFS.UnitTests -c Release --no-build --nologo

      - name: Windows integration tests
        run: dotnet test tests/ControlFS.WindowsIntegrationTests -c Release --no-build --nologo

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list ControlFS.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable packages found" }

  portable-core:
    name: Portable core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/ControlFS.UnitTests -c Release --nologo
