name: CI

# Builds the app and runs all tests on Windows (the only platform ControlFS targets)
# for every pull request into develop or main (Gitflow integration points).
on:
  # Gitflow: feature/* → develop and release/* or hotfix/* → main. Pushes to other branches don't run CI.
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # Cache de pacotes NuGet com chave nos lock files (a release não usa cache).
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore ControlFS.slnx --locked-mode

      - name: Build
        run: dotnet build ControlFS.slnx -c Release --no-restore --nologo

      - name: Unit tests and journeys
        run: dotnet test tests/ControlFS.UnitTests -c Release --no-build --nologo

      - name: Windows integration tests
        run: dotnet test tests/ControlFS.WindowsIntegrationTests -c Release --no-build --nologo

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list ControlFS.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable packages found" }
