name: WinGet manifest

# Gera e valida os manifestos do WinGet de uma release já publicada (#273). Nunca envia nada ao repositório da Microsoft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag already published (e.g. v0.12.0-alpha.1)"
        required: true

permissions:
  contents: read

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate and validate manifests
        shell: pwsh
        run: .\build\New-WingetManifest.ps1 -Tag "${{ inputs.tag }}" -OutDir artifacts\winget
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: artifacts/winget
