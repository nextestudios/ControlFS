name: Smoke

# Abre o app de verdade num Windows do GitHub e coleta evidências (processo, janela, eventos, print).
# "released": testa exatamente o ZIP portátil publicado numa release. "source": publica a partir do commit.
on:
  # Manual only: builds the packages and opens the real app. The release workflow runs the same launch checks before
  # publishing, so pull requests don't build packages.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to test (empty = build from this commit)"
        required: false

permissions:
  contents: read

jobs:
  released:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    name: Released portable (${{ github.event.inputs.release_tag }})
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the published files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p ControlFS-Portable-x64.exe -p ControlFS-Setup-x64.exe -D (Join-Path $env:RUNNER_TEMP rel)
      - name: Launch published portable exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "rel\ControlFS-Portable-x64.exe") $dir
          .\build\Test-Startup.ps1 -Exe (Join-Path $dir "ControlFS-Portable-x64.exe") -OutDir smoke-released-portable -Seconds 40
      - name: Install, launch and uninstall the published installer
        if: always()
        shell: pwsh
        run: .\build\Test-Installed.ps1 -Setup (Join-Path $env:RUNNER_TEMP "rel\ControlFS-Setup-x64.exe") -OutDir smoke-released-installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-released
          path: |
            smoke-released-portable
            smoke-released-installed

  source:
    name: Launch portable exe and installed app
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # Cache de pacotes NuGet com chave nos lock files (a release não usa cache).
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build portable exe and installer
        shell: pwsh
        run: .\build\Publish-ControlFS.ps1 -Runtime x64 -Target All -Version 0.0.0-smoke
      - name: Launch portable exe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\ControlFS-Portable-x64.exe $dir
          .\build\Test-Startup.ps1 -Exe (Join-Path $dir "ControlFS-Portable-x64.exe") -OutDir smoke-portable -Seconds 40
      - name: Install, launch and uninstall
        if: always()
        shell: pwsh
        run: .\build\Test-Installed.ps1 -Setup dist\ControlFS-Setup-x64.exe -OutDir smoke-installed
      # UI Automation (#83): teclas na janela real e conferência pelo UIA do que o WinUI desenhou (foco, diálogos,
      # escopo do modal, teclado virtual). Windows PowerShell: UIAutomationClient vem do .NET Framework.
      - name: UI Automation (focus, dialogs, on-screen keyboard)
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "uia"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\ControlFS-Portable-x64.exe $dir
          .\build\Test-UiAutomation.ps1 -Exe (Join-Path $dir "ControlFS-Portable-x64.exe") -OutDir smoke-uia
      # Layout responsivo (#36) e glifos (#33): a tela do runner é pequena, então o app simula cada resolução/escala e
      # salva PNGs das telas reais (--render-screens, só para desenvolvimento; ver docs/TESTING.md).
      - name: Render screens at 720p/800p/1080p/4K and the glyph gallery
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "render"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\ControlFS-Portable-x64.exe $dir
          $out = Join-Path $PWD "smoke-screens"
          $p = Start-Process -FilePath (Join-Path $dir "ControlFS-Portable-x64.exe") -WorkingDirectory $dir -ArgumentList "--render-screens", "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error::--render-screens did not finish in 10 min"; exit 1 }
          if (Test-Path (Join-Path $out "report.txt")) { Get-Content (Join-Path $out "report.txt") }
          Get-ChildItem (Join-Path $dir "ControlFS_Data\logs") -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $out -Force }
          if ($p.ExitCode -ne 0) { Write-Host "::error::--render-screens exited with $($p.ExitCode)"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: smoke-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence
          path: |
            smoke-portable
            smoke-installed
            smoke-uia
