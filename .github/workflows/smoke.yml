name: Smoke

# Abre o app de verdade num Windows do GitHub e coleta evidências (processo, janela, eventos, print).
# "released": testa exatamente o ZIP portátil publicado numa release. "source": publica a partir do commit.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release a testar (vazio = só o build do commit)"
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    name: Released portable (${{ github.event.inputs.release_tag }})
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract the published portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p ControlFS-Portable-x64.zip -D $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP ControlFS-Portable-x64.zip) -DestinationPath (Join-Path $env:RUNNER_TEMP portable)
      - name: Launch and collect evidence
        shell: pwsh
        run: .\build\Test-Startup.ps1 -Exe (Join-Path $env:RUNNER_TEMP "portable\ControlFS.exe") -OutDir smoke-released
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-released
          path: smoke-released

  source:
    name: Portable from source
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build portable
        shell: pwsh
        run: .\build\Publish-ControlFS.ps1 -Runtime x64 -Target Portable -Version 0.0.0-smoke
      - name: Launch and collect evidence
        shell: pwsh
        run: |
          Expand-Archive dist\ControlFS-Portable-x64.zip -DestinationPath (Join-Path $env:RUNNER_TEMP portable)
          .\build\Test-Startup.ps1 -Exe (Join-Path $env:RUNNER_TEMP "portable\ControlFS.exe") -OutDir smoke-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-source
          path: smoke-source
