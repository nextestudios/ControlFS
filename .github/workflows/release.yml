name: Release

# Push a tag like v0.2.0-alpha.2 on main to publish a release (only when the maintainer asks; PRs are merged without releasing).
# Alpha versions are published as regular releases so the newest one shows as "Latest", like Console Mode.
# The notes come from CHANGELOG.en-US.md (pasted) and CHANGELOG.md (linked); both need the section.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing (e.g. 0.2.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitflow guard (tags only on main)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tags must point to a commit on main (Gitflow: release/* or hotfix/* merged into main)." }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes (English, with a link to the Portuguese changelog)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          function Get-Notes([string]$file) {
            $changelog = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|\z)"
            $match = [regex]::Match($changelog, $pattern)
            if (-not $match.Success) { throw "$file precisa conter a seção ## [$($env:VERSION)]." }
            $notes = $match.Groups["notes"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) de $file está vazia." }
            return $notes
          }
          $null = Get-Notes "CHANGELOG.md"
          $en = Get-Notes "CHANGELOG.en-US.md"
          $tag = "v$($env:VERSION)"
          $releaseNotes = @(
            $en
            ""
            "### Downloads"
            ""
            '- **Installer:** `ControlFS-Setup-x64.exe` — installs the app per user (no admin) and updates itself.'
            '- **Portable:** `ControlFS-Portable-x64.exe` — a single executable; keeps its data in the `ControlFS_Data` folder next to the file.'
            ''
            '`release-manifest.json` and `release-manifest.json.sig` are the signed update manifest the installed app verifies (SHA-256 of both downloads).'
            ""
            "---"
            ""
            "🇧🇷 Notas em português: [CHANGELOG.md](https://github.com/$($env:REPO)/blob/$tag/CHANGELOG.md)"
          ) -join "`n"
          Set-Content -LiteralPath "release-notes.md" -Value $releaseNotes -Encoding utf8

      - name: Restore (locked)
        run: dotnet restore ControlFS.slnx --locked-mode

      - name: Run tests
        run: dotnet test ControlFS.slnx -c Release --no-restore --nologo

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer + portable
        shell: pwsh
        run: .\build\Publish-ControlFS.ps1 -Runtime x64 -Target All -Version "${{ steps.version.outputs.version }}"

      # Abre o app de verdade antes de publicar: o .exe portátil e a versão instalada (instalar, abrir, desinstalar).
      - name: Smoke-test portable exe (launch)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist\ControlFS-Portable-x64.exe $dir
          .\build\Test-Startup.ps1 -Exe (Join-Path $dir "ControlFS-Portable-x64.exe") -OutDir smoke-portable -Seconds 40

      - name: Smoke-test installer (install, launch, uninstall)
        shell: pwsh
        run: .\build\Test-Installed.ps1 -Setup dist\ControlFS-Setup-x64.exe -OutDir smoke-installed

      # A chave privada existe só no secret UPDATE_SIGNING_KEY; o script confere a assinatura contra a chave
      # pública embutida no app e falha se não bater. Sem manifesto assinado, o app não aceita a atualização.
      - name: Sign release manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .\build\New-ReleaseManifest.ps1 -Version "${{ steps.version.outputs.version }}" -Repository "${{ github.repository }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ControlFS-${{ steps.version.outputs.version }}
          path: |
            dist/ControlFS-Setup-x64.exe
            dist/ControlFS-Portable-x64.exe
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/release-manifest.json.sig
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ControlFS ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          files: |
            dist/ControlFS-Setup-x64.exe
            dist/ControlFS-Portable-x64.exe
            dist/release-manifest.json
            dist/release-manifest.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
